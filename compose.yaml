name: nas-foundation

services:
  pihole:
    image: ${PIHOLE_IMAGE:-pihole/pihole:latest}
    container_name: pihole
    hostname: pihole
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: ${UPSTREAM_DNS:-1.1.1.1;1.0.0.1}
      FTLCONF_misc_etc_dnsmasq_d: "true"
      FTLCONF_misc_dnsmasq_lines: "address=/${JELLYFIN_HOSTNAME}/${SERVER_IP};address=/${PIHOLE_HOSTNAME}/${SERVER_IP};address=/${PORTAINER_HOSTNAME}/${SERVER_IP}"
    ports:
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:53:53/tcp"
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:53:53/udp"
    volumes:
      - ./data/pihole:/etc/pihole
      - ./dnsmasq.d:/etc/dnsmasq.d:ro
    networks:
      - frontend
    restart: unless-stopped

  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:latest}
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_HOSTNAME}
    init: true
    ports:
      - "${JELLYFIN_DISCOVERY_BIND_ADDRESS:-0.0.0.0}:7359:7359/udp"
    expose:
      - "8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media:ro
    networks:
      - frontend
    restart: unless-stopped
    stop_grace_period: 30s

  portainer:
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:lts}
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    expose:
      - "9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: caddy
    environment:
      JELLYFIN_HOSTNAME: ${JELLYFIN_HOSTNAME}
      PIHOLE_HOSTNAME: ${PIHOLE_HOSTNAME}
      PORTAINER_HOSTNAME: ${PORTAINER_HOSTNAME}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:80:80/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:443:443/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - frontend
    depends_on:
      - jellyfin
      - pihole
      - portainer
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  frontend:
    name: nas-foundation

